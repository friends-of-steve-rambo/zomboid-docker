# Реестр модов сервера Project Zomboid.
#
# Их НАДО потом внедрить в конфиг сервера:
# Изначально и после изменений - python3 scripts/sync_mods_env.py
#
# Порядок записей - приоритет для независимых модов.
# depends_on - ссылки на mod_id. Скрипт поставит зависимости перед модом

mods:
  - name: ZombieBuddy
    workshop_id: "3619862853"
    mod_ids:
      - ZombieBuddy

  - name: Project Viewpoint
    workshop_id: "3809306528"
    mod_ids:
      - Viewpoint
    depends_on:
      - ZombieBuddy

  - name: "Project Viewpoint: Recoil & ADS"
    workshop_id: "3812612054"
    mod_ids:
      - ProjectViewpointADS
    depends_on:
      - ZombieBuddy
      - Viewpoint

  - name: Viewpoint True Ballistics
    workshop_id: "3812864848"
    mod_ids:
      - ViewpointTrueBallistics
    depends_on:
      - ZombieBuddy
      - Viewpoint

  - name: Viewpoint Advanced Throwables
    workshop_id: "3813194971"
    mod_ids:
      - ViewpointAdvancedThrowables
    depends_on:
      - ZombieBuddy
      - Viewpoint

